services:
  - type: web
    name: datamind-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt gunicorn==23.0.0
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MAX_UPLOAD_MB
        value: 10
      - key: MAX_API_BODY_MB
        value: 40
      - key: SESSION_TTL_SECONDS
        value: 7200
      - key: MAX_SESSIONS
        value: 50
      - key: FLASK_DEBUG
        value: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
